<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Patrimônio – SUPERVILLE</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Favicon inline SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23b91c1c'/><text x='16' y='24' font-size='20' font-weight='900' text-anchor='middle' fill='white' font-family='sans-serif'>S</text></svg>" />
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">SV</div>
      <div class="logo-text">
        <span>SUPERVILLE</span>
        <span>Controle de Patrimônio</span>
      </div>
    </div>
    <div class="header-actions">
      <!-- Contador total no header -->
      <span id="header-total" style="font-size:13px;color:var(--cinza);display:flex;align-items:center;gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        <span id="header-count">0</span> equipamentos
      </span>
    </div>
  </div>
</header>

<!-- ===================== CONTEÚDO ===================== -->
<main class="container">

  <!-- Título da Página -->
  <div class="page-title-block">
    <h1>CONTROLE DE<br><span>PATRIMÔNIO</span></h1>
    <p>Gerenciamento de celulares corporativos</p>
  </div>

  <!-- Estatísticas -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat-card">
      <div class="stat-icon total">
        <!-- Ícone celular -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </div>
      <div class="stat-info">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon uso">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-info">
        <span class="stat-num" id="stat-uso">0</span>
        <span class="stat-label">Em Uso</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon disp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="stat-info">
        <span class="stat-num" id="stat-disp">0</span>
        <span class="stat-label">Disponíveis</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon manut">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div class="stat-info">
        <span class="stat-num" id="stat-manut">0</span>
        <span class="stat-label">Manutenção</span>
      </div>
    </div>
  </div>

  <!-- Pesquisa e Filtro -->
  <div class="search-bar">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="text"
        id="search"
        class="search-input"
        placeholder="Buscar por patrimônio, IMEI, responsável, setor..."
        autocomplete="off"
      />
    </div>
    <select id="filter-status" class="filter-select">
      <option value="">Todos os status</option>
      <option value="Em uso">Em uso</option>
      <option value="Disponível">Disponível</option>
      <option value="Manutenção">Manutenção</option>
    </select>
    <select id="filter-setor" class="filter-select">
      <option value="">Todos os setores</option>
    </select>
  </div>

  <!-- Grid de Cartões -->
  <div class="cards-grid" id="cards-grid">
    <!-- Gerado por JS -->
  </div>

</main>

<!-- Scripts -->
<script src="dados.js"></script>
<script src="script.js"></script>
<script>
// ============================================================
// index.js - Lógica da página inicial
// ============================================================

document.addEventListener('DOMContentLoaded', () => {
  const todos = getTodosPatrimonios();

  // ---- Estatísticas ----
  const total = todos.length;
  const emUso = todos.filter(p => p.status === 'Em uso').length;
  const disp  = todos.filter(p => p.status === 'Disponível').length;
  const manut = todos.filter(p => p.status === 'Manutenção').length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-uso').textContent   = emUso;
  document.getElementById('stat-disp').textContent  = disp;
  document.getElementById('stat-manut').textContent = manut;
  document.getElementById('header-count').textContent = total;

  // ---- Popular filtro de setores ----
  const setores = [...new Set(todos.map(p => p.setor))].sort();
  const selSetor = document.getElementById('filter-setor');
  setores.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    selSetor.appendChild(opt);
  });

  // ---- Renderizar cartões ----
  function renderCards(lista) {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = '';

    if (lista.length === 0) {
      grid.innerHTML = `
        <div class="no-results">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <p>Nenhum patrimônio encontrado.</p>
        </div>`;
      return;
    }

    lista.forEach(p => {
      const card = document.createElement('div');
      card.className = 'patrimonio-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Patrimônio ${p.id} - ${p.modelo}`);

      card.innerHTML = `
        <div class="card-header">
          <div class="card-num">
            <small>PATRIMÔNIO</small>
            #${esc(p.id)}
          </div>
          <span class="status-badge ${getStatusClass(p.status)}">${esc(p.status)}</span>
        </div>
        <div class="card-equip">${esc(p.equipamento)}</div>
        <div class="card-modelo">${esc(p.modelo)}</div>
        <div class="card-divider"></div>
        <div class="card-meta">
          <div class="card-meta-item">
            <span>Setor</span>
            <span>${esc(p.setor)}</span>
          </div>
          <div class="card-meta-item">
            <span>Responsável</span>
            <span>${esc(p.responsavel)}</span>
          </div>
        </div>
      `;

      // Clicar ou pressionar Enter abre o patrimônio
      const abrirPatrimonio = () => {
        window.location.href = `patrimonio.html?id=${p.id}`;
      };
      card.addEventListener('click', abrirPatrimonio);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') abrirPatrimonio();
      });

      grid.appendChild(card);
    });
  }

  // ---- Filtro e pesquisa ----
  function filtrar() {
    const q      = document.getElementById('search').value.toLowerCase().trim();
    const status = document.getElementById('filter-status').value;
    const setor  = document.getElementById('filter-setor').value;
    const todos  = getTodosPatrimonios();

    const filtrados = todos.filter(p => {
      const matchQ = !q
        || p.id.toLowerCase().includes(q)
        || p.imei.toLowerCase().includes(q)
        || p.responsavel.toLowerCase().includes(q)
        || p.setor.toLowerCase().includes(q)
        || p.modelo.toLowerCase().includes(q)
        || p.equipamento.toLowerCase().includes(q);

      const matchStatus = !status || p.status === status;
      const matchSetor  = !setor  || p.setor === setor;

      return matchQ && matchStatus && matchSetor;
    });

    renderCards(filtrados);
  }

  document.getElementById('search').addEventListener('input', filtrar);
  document.getElementById('filter-status').addEventListener('change', filtrar);
  document.getElementById('filter-setor').addEventListener('change', filtrar);

  // Render inicial
  renderCards(todos);
});
</script>
</body>
</html>
