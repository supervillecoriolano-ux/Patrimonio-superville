<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patrimônio — SuperVille</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='16' fill='%234a9e4a'/><text x='16' y='22' font-size='16' font-weight='900' text-anchor='middle' fill='white' font-family='sans-serif'>🌿</text></svg>"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-leaf">🌿</div>
      <div class="logo-text">
        <div class="nome">super<span>ville</span></div>
        <div class="sub">Controle de Patrimônio</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-back" onclick="location.href='index.html'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
      </button>
    </div>
  </div>
</header>

<main class="container" id="main"></main>

<!-- MODAL: INICIAR USO -->
<div class="modal-overlay" id="modal-uso">
  <div class="modal">
    <div class="modal-header">
      <h2>🟢 Iniciar Uso</h2>
      <button class="modal-close" onclick="fecharModal('modal-uso')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Seu nome completo *</label>
          <input type="text" id="u-nome" placeholder="Nome completo"/>
        </div>
        <div class="form-group">
          <label>Seu setor *</label>
          <input type="text" id="u-setor" placeholder="Ex: Prevenção"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data</label>
          <input type="text" id="u-data" readonly/>
        </div>
        <div class="form-group">
          <label>Hora</label>
          <input type="text" id="u-hora" readonly/>
        </div>
      </div>

      <!-- CÂMERA -->
      <div class="form-group">
        <label>📸 Foto do rosto (obrigatória)</label>
        <div class="camera-box" id="camera-box">
          <video id="camera-video" autoplay playsinline muted></video>
          <canvas id="camera-canvas" style="display:none;"></canvas>
        </div>
        <div id="camera-status" style="font-size:12px;color:var(--cinza);margin-bottom:8px;"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline" id="btn-abrir-camera" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Abrir câmera
          </button>
          <button class="btn btn-primary" id="btn-capturar" type="button" style="display:none;">
            📷 Tirar foto
          </button>
          <button class="btn btn-ghost" id="btn-refazer" type="button" style="display:none;">
            🔄 Refazer
          </button>
        </div>
        <img id="foto-preview" class="foto-preview" style="display:none; margin-top:12px;" alt="Foto capturada"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="fecharModal('modal-uso')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-uso">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Confirmar uso
      </button>
    </div>
  </div>
</div>

<!-- MODAL: DEVOLVER -->
<div class="modal-overlay" id="modal-dev">
  <div class="modal">
    <div class="modal-header">
      <h2>↩️ Devolver aparelho</h2>
      <button class="modal-close" onclick="fecharModal('modal-dev')">&times;</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--branco-2);font-size:14px;margin-bottom:16px;">Para confirmar a devolução, tire uma foto do rosto e confirme.</p>
      <div class="form-row">
        <div class="form-group">
          <label>Data devolução</label>
          <input type="text" id="d-data" readonly/>
        </div>
        <div class="form-group">
          <label>Hora devolução</label>
          <input type="text" id="d-hora" readonly/>
        </div>
      </div>
      <!-- Câmera devolução -->
      <div class="form-group">
        <label>📸 Foto de confirmação (obrigatória)</label>
        <div class="camera-box" id="camera-box-dev">
          <video id="camera-video-dev" autoplay playsinline muted></video>
          <canvas id="camera-canvas-dev" style="display:none;"></canvas>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn btn-outline" id="btn-abrir-camera-dev" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Abrir câmera
          </button>
          <button class="btn btn-primary" id="btn-capturar-dev" type="button" style="display:none;">📷 Tirar foto</button>
          <button class="btn btn-ghost"   id="btn-refazer-dev" type="button" style="display:none;">🔄 Refazer</button>
        </div>
        <img id="foto-preview-dev" class="foto-preview" style="display:none;margin-top:12px;" alt="Foto devolução"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="fecharModal('modal-dev')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-dev">↩️ Confirmar devolução</button>
    </div>
  </div>
</div>

<script src="dados.js"></script>
<script src="script.js"></script>
<script>
// ── Parâmetros ──
const params = new URLSearchParams(location.search);
const pid    = params.get('id');
const BASE   = location.origin + location.pathname.replace('patrimonio.html','');

let fotoBase64    = null;  // foto início de uso
let fotoDevBase64 = null;  // foto devolução
let streamRef     = null;
let streamDevRef  = null;

// ── Render principal ──
function render() {
  const p = patrimonios.find(x => x.id === pid);
  const main = document.getElementById('main');

  if (!p) {
    main.innerHTML = `<div class="not-found"><h2>404</h2><p>Patrimônio <strong>#${esc(pid||'?')}</strong> não encontrado.</p><button class="btn btn-outline" onclick="location.href='index.html'">Voltar</button></div>`;
    return;
  }

  document.title = `Patrimônio #${p.id} — SuperVille`;
  const status  = calcStatus(p.id);
  const uso     = getUsoAtivo(p.id);
  const horas   = uso ? ((Date.now() - uso.ts) / 3600000).toFixed(1) : null;
  const atrasado = status === 'Atrasado';

  // Bloco de uso ativo
  let usoHTML = '';
  if (uso) {
    usoHTML = `
      <div class="uso-ativo-box">
        <h4>🟢 Em uso agora</h4>
        ${atrasado ? `<div class="atrasado-aviso">⚠️ Prazo de ${HORAS_DEVOLUCAO}h excedido! Devolução em atraso.</div>` : ''}
        <div class="uso-ativo-info">
          <div class="uso-pessoa">
            <img src="${uso.fotoBase64}" class="uso-foto-thumb" alt="Foto"/>
            <div class="uso-pessoa-info">
              <div class="nome">${esc(uso.nome)}</div>
              <div class="setor-txt">${esc(uso.setor)}</div>
            </div>
          </div>
          <div><div class="field-label">Retirado em</div><div class="field-value">${esc(uso.data)} às ${esc(uso.hora)}</div></div>
          <div><div class="field-label">Horas em uso</div><div class="field-value">${horas}h ${atrasado ? '⚠️' : ''}</div></div>
        </div>
        <button class="btn btn-danger" id="btn-devolver" style="font-size:14px;padding:10px 22px;">
          ↩️ Devolver aparelho
        </button>
      </div>`;
  }

  // Botão iniciar
  let btnIniciarHTML = '';
  if (!uso) {
    btnIniciarHTML = `
      <div style="margin-bottom:18px;">
        <button class="btn btn-primary btn-lg" id="btn-iniciar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Iniciar uso deste aparelho
        </button>
      </div>`;
  }

  main.innerHTML = `
    <div class="patr-layout">
      <div>
        <!-- Hero -->
        <div class="patr-hero">
          <div class="patr-hero-top">
            <div class="patr-id"><small>Patrimônio</small>#${esc(p.id)}</div>
            <div class="patr-hero-btns">
              <button class="btn btn-ghost" onclick="window.print()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Imprimir
              </button>
            </div>
          </div>
          <div class="patr-equip">${esc(p.equipamento)}</div>
          <div class="patr-modelo">${esc(p.modelo)}</div>
        </div>

        <!-- Status visual -->
        <div style="margin-bottom:14px;">${badgeHTML(status)}</div>

        ${usoHTML}
        ${btnIniciarHTML}

        <!-- Dados -->
        <div class="section-card">
          <div class="section-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Dados do equipamento
          </div>
          <div class="fields-grid">
            <div class="field-item"><div class="field-label">IMEI</div><div class="field-value mono">${esc(p.imei)}</div></div>
            <div class="field-item"><div class="field-label">Série</div><div class="field-value mono">${esc(p.serie)}</div></div>
            <div class="field-item"><div class="field-label">Setor padrão</div><div class="field-value">${esc(p.setor)}</div></div>
            <div class="field-item"><div class="field-label">Responsável</div><div class="field-value">${esc(p.responsavel)}</div></div>
            <div class="field-item"><div class="field-label">Cadastrado em</div><div class="field-value">${esc(p.dataCadastro)}</div></div>
            <div class="field-item"><div class="field-label">Atualizado em</div><div class="field-value">${esc(p.ultimaAtualizacao)}</div></div>
            <div class="field-item span2"><div class="field-label">Observações</div><div class="field-value">${esc(p.observacoes)||'—'}</div></div>
          </div>
        </div>

        <!-- Histórico -->
        <div class="section-card">
          <div class="section-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Histórico de movimentações
          </div>
          <div class="table-wrap" id="historico-wrap"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-card" style="text-align:center;">
          <h3>QR Code</h3>
          <div class="qr-box" id="qr-box"></div>
          <div class="qr-url" id="qr-url"></div>
        </div>
      </aside>
    </div>`;

  // Gerar QR
  const url = `${BASE}patrimonio.html?id=${p.id}`;
  document.getElementById('qr-url').textContent = url;
  new QRCode(document.getElementById('qr-box'), { text: url, width: 180, height: 180, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.H });

  // Histórico
  renderHistorico();

  // Eventos
  if (!uso) {
    document.getElementById('btn-iniciar').addEventListener('click', () => abrirModalUso(p));
  } else {
    document.getElementById('btn-devolver').addEventListener('click', () => abrirModalDev(p, uso));
  }
}

// ── Histórico ──
function renderHistorico() {
  const h = getHistorico(pid);
  const wrap = document.getElementById('historico-wrap');
  if (!wrap) return;
  if (!h.length) {
    wrap.innerHTML = '<div class="empty-table"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><p>Sem movimentações registradas.</p></div>';
    return;
  }
  wrap.innerHTML = `<table><thead><tr><th>Data</th><th>Hora</th><th>Nome</th><th>Setor</th><th>Tipo</th><th>Obs</th></tr></thead><tbody>
    ${h.map(r => `<tr><td>${esc(r.data)}</td><td>${esc(r.hora)}</td><td>${esc(r.nome)}</td><td>${esc(r.setor)}</td><td>${tipoBadge(r.tipo)}</td><td style="color:var(--cinza)">${esc(r.obs)||'—'}</td></tr>`).join('')}
  </tbody></table>`;
}

// ── Modal Iniciar Uso ──
function abrirModalUso(p) {
  fotoBase64 = null;
  const { data, hora } = agora();
  document.getElementById('u-data').value = data;
  document.getElementById('u-hora').value = hora;
  document.getElementById('u-nome').value = '';
  document.getElementById('u-setor').value = '';
  document.getElementById('foto-preview').style.display = 'none';
  document.getElementById('btn-capturar').style.display = 'none';
  document.getElementById('btn-refazer').style.display = 'none';
  document.getElementById('btn-abrir-camera').style.display = 'inline-flex';
  document.getElementById('camera-box').classList.remove('tem-video');
  document.getElementById('camera-status').textContent = '';
  pararStream(streamRef);
  abrirModal('modal-uso');
  setTimeout(() => document.getElementById('u-nome').focus(), 200);
}

// ── Modal Devolver ──
function abrirModalDev(p, uso) {
  fotoDevBase64 = null;
  const { data, hora } = agora();
  document.getElementById('d-data').value = data;
  document.getElementById('d-hora').value = hora;
  document.getElementById('foto-preview-dev').style.display = 'none';
  document.getElementById('btn-capturar-dev').style.display = 'none';
  document.getElementById('btn-refazer-dev').style.display = 'none';
  document.getElementById('btn-abrir-camera-dev').style.display = 'inline-flex';
  document.getElementById('camera-box-dev').classList.remove('tem-video');
  pararStream(streamDevRef);
  abrirModal('modal-dev');
}

// ── Câmera helpers ──
function pararStream(stream) {
  if (stream) stream.getTracks().forEach(t => t.stop());
}

async function iniciarCamera(videoEl, boxEl, statusEl) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    videoEl.srcObject = stream;
    boxEl.classList.add('tem-video');
    if (statusEl) statusEl.textContent = 'Câmera ativa — posicione o rosto e tire a foto.';
    return stream;
  } catch(e) {
    if (statusEl) statusEl.textContent = '❌ Não foi possível acessar a câmera: ' + e.message;
    return null;
  }
}

function capturarFoto(videoEl, canvasEl) {
  canvasEl.width  = videoEl.videoWidth  || 320;
  canvasEl.height = videoEl.videoHeight || 240;
  canvasEl.getContext('2d').drawImage(videoEl, 0, 0);
  return canvasEl.toDataURL('image/jpeg', 0.7);
}

// ── Confirmar uso ──
async function confirmarUso() {
  const nome  = document.getElementById('u-nome').value.trim();
  const setor = document.getElementById('u-setor').value.trim();
  if (!nome || !setor) { showToast('Preencha nome e setor.', 'erro'); return; }
  if (!fotoBase64)     { showToast('Tire a foto do rosto para continuar.', 'erro'); return; }

  // Verificar bloqueio
  if (estaBloqueado(nome, setor)) {
    showToast('⛔ Você tem um aparelho não devolvido. Devolva antes de retirar outro.', 'erro');
    fecharModal('modal-uso');
    return;
  }

  const { data, hora, ts } = agora();
  pararStream(streamRef); streamRef = null;

  setUsoAtivo(pid, { nome, setor, data, hora, ts, fotoBase64 });
  addHistorico(pid, { data, hora, nome, setor, tipo: 'Retirada', obs: '' });
  fecharModal('modal-uso');
  showToast('✅ Uso iniciado com sucesso!');
  setTimeout(render, 400);
}

// ── Confirmar devolução ──
function confirmarDev() {
  if (!fotoDevBase64) { showToast('Tire a foto de confirmação.', 'erro'); return; }
  const { data, hora } = agora();
  const uso = getUsoAtivo(pid);
  pararStream(streamDevRef); streamDevRef = null;

  removerUsoAtivo(pid);
  removerBloqueado(uso.nome, uso.setor);
  addHistorico(pid, { data, hora, nome: uso.nome, setor: uso.setor, tipo: 'Devolução', obs: '' });
  fecharModal('modal-dev');
  showToast('↩️ Aparelho devolvido com sucesso!');
  setTimeout(render, 400);
}

// ── Bind câmera modal uso ──
function bindCameraUso() {
  document.getElementById('btn-abrir-camera').addEventListener('click', async () => {
    streamRef = await iniciarCamera(
      document.getElementById('camera-video'),
      document.getElementById('camera-box'),
      document.getElementById('camera-status')
    );
    if (streamRef) {
      document.getElementById('btn-abrir-camera').style.display = 'none';
      document.getElementById('btn-capturar').style.display = 'inline-flex';
    }
  });
  document.getElementById('btn-capturar').addEventListener('click', () => {
    fotoBase64 = capturarFoto(document.getElementById('camera-video'), document.getElementById('camera-canvas'));
    pararStream(streamRef); streamRef = null;
    document.getElementById('camera-box').classList.remove('tem-video');
    document.getElementById('foto-preview').src = fotoBase64;
    document.getElementById('foto-preview').style.display = 'block';
    document.getElementById('btn-capturar').style.display = 'none';
    document.getElementById('btn-refazer').style.display = 'inline-flex';
    document.getElementById('camera-status').textContent = '✅ Foto capturada!';
  });
  document.getElementById('btn-refazer').addEventListener('click', async () => {
    fotoBase64 = null;
    document.getElementById('foto-preview').style.display = 'none';
    document.getElementById('btn-refazer').style.display = 'none';
    document.getElementById('btn-abrir-camera').style.display = 'inline-flex';
    document.getElementById('camera-status').textContent = '';
  });
  document.getElementById('btn-confirmar-uso').addEventListener('click', confirmarUso);
}

// ── Bind câmera modal devolução ──
function bindCameraDev() {
  document.getElementById('btn-abrir-camera-dev').addEventListener('click', async () => {
    streamDevRef = await iniciarCamera(
      document.getElementById('camera-video-dev'),
      document.getElementById('camera-box-dev'),
      null
    );
    if (streamDevRef) {
      document.getElementById('btn-abrir-camera-dev').style.display = 'none';
      document.getElementById('btn-capturar-dev').style.display = 'inline-flex';
    }
  });
  document.getElementById('btn-capturar-dev').addEventListener('click', () => {
    fotoDevBase64 = capturarFoto(document.getElementById('camera-video-dev'), document.getElementById('camera-canvas-dev'));
    pararStream(streamDevRef); streamDevRef = null;
    document.getElementById('camera-box-dev').classList.remove('tem-video');
    document.getElementById('foto-preview-dev').src = fotoDevBase64;
    document.getElementById('foto-preview-dev').style.display = 'block';
    document.getElementById('btn-capturar-dev').style.display = 'none';
    document.getElementById('btn-refazer-dev').style.display = 'inline-flex';
  });
  document.getElementById('btn-refazer-dev').addEventListener('click', () => {
    fotoDevBase64 = null;
    document.getElementById('foto-preview-dev').style.display = 'none';
    document.getElementById('btn-refazer-dev').style.display = 'none';
    document.getElementById('btn-abrir-camera-dev').style.display = 'inline-flex';
  });
  document.getElementById('btn-confirmar-dev').addEventListener('click', confirmarDev);
}

// Fechar modais clicando fora ou Esc
['modal-uso','modal-dev'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) {
      pararStream(streamRef); pararStream(streamDevRef);
      fecharModal(id);
    }
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    pararStream(streamRef); pararStream(streamDevRef);
    fecharModal('modal-uso'); fecharModal('modal-dev');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  if (!pid) { document.getElementById('main').innerHTML = '<div class="not-found"><h2>Ops!</h2><p>Nenhum ID informado.</p></div>'; return; }
  render();
  bindCameraUso();
  bindCameraDev();
});
</script>
</body>
</html>
