<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Code de Devolução — SuperVille</title>
<link rel="stylesheet" href="style.css?v=20260727a"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{overflow-x:hidden}
  .qr-print-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .qr-print-card{background:#fff;border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center;color:#111;}
  .qr-print-card h1{font-family:var(--font-t);font-size:20px;font-weight:900;color:#111;margin-bottom:6px;}
  .qr-print-card p{font-size:13px;color:#555;margin-bottom:20px;line-height:1.5;}
  #qr-canvas-wrap{display:flex;justify-content:center;margin-bottom:16px;}
  .qr-print-footer{font-size:11px;color:#888;margin-top:16px;}
  .no-print{margin-top:22px;}
  @media print{
    body,.qr-print-wrap{background:#fff!important;}
    .no-print{display:none!important;}
    .qr-print-card{border:none;padding:0;}
  }
</style>
</head>
<body>
<!-- SUPERVILLE SECURITY LAYER v1.0 -->
<script>
(function(){
  var _h=location.hostname;
  var _a=["supervillecoriolano-ux.github.io","127.0.0.1","localhost"];
  if(!_a.some(function(d){return _h===d||_h.endsWith("."+d);})){
    document.body.innerHTML='<div style="margin:0;background:#0d0d0d;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;"><div style="text-align:center;color:#fff;padding:40px;"><div style="font-size:64px;margin-bottom:16px;">&#128274;</div><h1 style="color:#e74c3c;">Acesso Negado</h1><p style="color:#888;font-size:14px;">Sistema de uso exclusivo da SuperVille Supermercado.</p></div></div>';
    throw new Error("SVSC:DOMAIN_BLOCKED");
  }
})();
</script>

<div class="qr-print-wrap">
  <div class="qr-print-card">
    <h1>📱 QR Code de Devolução</h1>
    <p>Fixe esta folha em um local do escritório. Os colaboradores devem escanear este QR Code para conseguir devolver um aparelho no sistema.</p>
    <div id="qr-canvas-wrap"><div class="spinner" style="border-color:#ddd;border-top-color:#4a9e4a;"></div></div>
    <div class="qr-print-footer">SuperVille · Controle de Patrimônio</div>
    <div class="no-print" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir</button>
      <button class="btn btn-outline" onclick="location.href='admin.html'">← Voltar ao Admin</button>
    </div>
  </div>
</div>

<script>
// Token fixo — deve ser sempre o mesmo usado na validação em patrimonio.html
var TOKEN_QR_DEVOLUCAO = 'e0cee687-8a98-4f58-8fef-ac1137c7abf7';
var wrap = document.getElementById('qr-canvas-wrap');
wrap.innerHTML = '';
new QRCode(wrap, {
  text: 'SVQR-DEV:' + TOKEN_QR_DEVOLUCAO,
  width: 240,
  height: 240,
  colorDark: '#111111',
  colorLight: '#ffffff'
});
</script>
</body>
</html>
